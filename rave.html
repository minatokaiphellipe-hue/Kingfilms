<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingfilms - Testador de Link Direto</title>
    <!-- Importando a biblioteca Clappr que lê arquivos m3u8 -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <style>
        body {
            background-color: #020617;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        #player {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16/9;
            background-color: #000;
            border: 2px solid #3b82f6;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 20px;
        }
        .painel {
            background: #1e293b;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            max-width: 770px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="painel">
        <h2 style="margin: 0; color: #4ade80;">📺 Testador de Canais</h2>
        <p style="font-size: 13px; color: #94a3b8;">Canal ID: 17 | Servidor: Falcon12</p>
    </div>

    <!-- Espaço onde o vídeo vai tocar -->
    <div id="player"></div>

    <script>
        // O link corrigido que não estava rodando no navegador
        var linkDoCanal = "http://falcon12.top:80/live/151998523/414726440/17.m3u8";

        var player = new Clappr.Player({
            source: linkDoCanal,
            parentId: "#player",
            autoPlay: true,
            width: '100%',
            height: '100%',
            poster: 'https://m.media-amazon.com/images/G/01/digital/video/magellan/blank-image.jpg', // Capa de espera 
            mediacontrol: {seekbar: "#e50914", buttons: "#fff"} // Cores do Kingfilms
        });
    </script>

</body>
</html>
