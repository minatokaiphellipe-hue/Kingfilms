name: Limpeza Profunda do Feed
on: workflow_dispatch

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Busca Implacavel
        run: |
          # Varre arquivos HTML, JS e JSON que não estejam na pasta /v/
          find . -type f | grep -v "/v/" | grep -E "\.(html|js|json)$" | xargs --no-run-if-empty sed -i 's/𝐊𝐢𝐧𝐠𝐟𝐢𝐥𝐦𝐬 🌀//g'
          find . -type f | grep -v "/v/" | grep -E "\.(html|js|json)$" | xargs --no-run-if-empty sed -i 's/🌀//g'
      - name: Salvar e Publicar
        run: |
          git config --local user.email "admin@kingfilms.com"
          git config --local user.name "Kingfilms Bot"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Limpeza cirúrgica do feed (HTML/JS/JSON)" && git push)
          
