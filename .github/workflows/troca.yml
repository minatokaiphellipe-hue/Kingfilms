name: Limpar Feed e Capas
on: workflow_dispatch

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Limpar tudo exceto a pasta /v/
        run: |
          # Procura todos os HTMLs que NÃO estão na pasta /v/ e remove os símbolos e espaços
          find . -type f -name "*.html" ! -path "./v/*" -exec sed -i 's/ *𝐊𝐢𝐧𝐠𝐟𝐢𝐥𝐦𝐬 🌀//g' {} +
          find . -type f -name "*.html" ! -path "./v/*" -exec sed -i 's/ *🌀//g' {} +
      - name: Salvar e Publicar
        run: |
          git config --local user.email "admin@kingfilms.com"
          git config --local user.name "Kingfilms Bot"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Limpeza das capas: removendo marca fora da pasta /v/" && git push)
          
