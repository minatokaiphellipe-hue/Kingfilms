<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-dark: #020617; --panel-bg: rgba(30, 41, 59, 0.7); --input-bg: #0f172a;
        --border-color: #334155; --brand-red: #e50914; --brand-red-hover: #b00710;
        --text-main: #f8fafc; --text-muted: #94a3b8;

    body { background: linear-gradient(135deg, #0f172a 0%, var(--bg-dark) 100%); color: var(--text-main); font-family: 'Poppins', sans-serif; padding: 20px 10px; text-align: center; margin: 0; min-height: 100vh; }
    .c { max-width: 800px; margin: auto; background: var(--panel-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 25px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    h1 { color: var(--brand-red); margin: 0 0 20px; font-weight: 800; letter-spacing: 1px; text-shadow: 0 2px 10px rgba(229, 9, 20, 0.3); }
    input, select, textarea { width: 100%; padding: 14px; background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 12px; box-sizing: border-box; font-family: 'Poppins', sans-serif; font-size: 14px; transition: 0.3s ease; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand-red); box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.2); }
    input::placeholder, textarea::placeholder { color: var(--text-muted); }
    .btn { background: linear-gradient(135deg, var(--brand-red), var(--brand-red-hover)); color: #fff; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: 600; font-size: 14px; letter-spacing: 0.5px; margin-bottom: 12px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(229, 9, 20, 0.4); }
    .btn:active { transform: translateY(0); }
    .blk { background: #1e293b; padding: 15px; margin-bottom: 15px; border-radius: 10px; border: 1px solid var(--border-color); border-left: 4px solid var(--brand-red); text-align: left; }
    .hd { display: none; }
    .sw { display: flex; gap: 8px; margin-bottom: 25px; justify-content: center; flex-wrap: wrap; }
    .sw label { background: var(--input-bg); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 30px; font-size: 12px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 5px; }
    .sw input[type="radio"] { display: none; }
    .sw label:has(input:checked) { background: var(--brand-red); border-color: var(--brand-red); color: #fff; box-shadow: 0 4px 10px rgba(229, 9, 20, 0.3); }
    #login-screen { position: fixed; inset: 0; background: linear-gradient(135deg, #0f172a 0%, var(--bg-dark) 100%); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .login-box { background: var(--panel-bg); backdrop-filter: blur(16px); padding: 40px 30px; border-radius: 16px; text-align: center; width: 90%; max-width: 400px; border: 1px solid rgba(255,255,255,0.05); }
    #log { background: #020617; color: #4ade80; font-family: monospace; padding: 15px; border-radius: 8px; font-size: 12px; text-align: left; margin-top: 15px; border: 1px solid #064e3b; max-height: 250px; overflow-y: auto; }
    .type-switch { display: flex; gap: 15px; margin-bottom: 12px; flex-wrap: wrap; }
    .type-switch label { font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-main); display: flex; align-items: center; gap: 5px;}
    .type-switch input { width: auto; margin: 0; accent-color: var(--brand-red); }
    .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 15px; }
    .dash-card { background: #0f172a; border: 1px solid #334155; padding: 20px; border-radius: 10px; text-align: center; }
    .dash-card h3 { margin: 0 0 10px 0; font-size: 12px; color: var(--text-muted); text-transform: uppercase; }
    .dash-card .num { font-size: 32px; font-weight: 800; color: #fff; margin: 0; }
    .dash-card .num.red { color: var(--brand-red); }
</style></head><body>

        <button class="btn" id="b-add" onclick="p()">🚀 PUBLICAR CONTEÚDO</button>
    </div>
</div>

<div id="t-tmdb" class="hd">
    <div class="blk"><input id="tq" placeholder="Digite o nome do Filme ou Série..."><button class="btn" style="background:linear-gradient(135deg, #f59e0b, #d97706);color:#fff" id="b-tmdb" onclick="bT()">🔍 PESQUISAR NO TMDB</button></div>

    <div id="aR"></div>
</div>

<div id="t-asp" class="hd">
    <div class="blk" style="text-align:center;">
        <h2 style="margin:0 0 10px;color:#fff;font-size:16px;">Aspirador Gocine API</h2>
        <p style="font-size:12px;color:var(--text-muted);margin-bottom:15px;">Varre a sua API e importa o catálogo em massa com player dinâmico. Extração focada em Capas Amazon HD.</p>
        <button class="btn" style="background:#f43f5e;" onclick="iniciarAspirador()" id="b-aspirador">🌪️ INICIAR ASPIRAÇÃO MASSIVA</button>
        <div id="aspRes" style="margin-top:15px;font-size:12px;text-align:left; max-height: 250px; overflow-y: auto;"></div>

</div>

<div id="t-dash" class="hd">

</div>

        <h2 style="margin:0 0 10px;color:#fff;font-size:16px;">Radar de Links</h2>
        <button class="btn" style="background:#8b5cf6;" onclick="checkLinks()" id="b-chk">🔗 INICIAR VARREDURA</button>

</div>

</div>
    <div id="log" class="hd"></div>
</div>
<script>
function checkPwd() {
    let p = document.getElementById('admin-pwd').value;
    let k = [18, 27, 28, 30, 24, 26, 27, 25, 94, 94]; 
    let match = p.length === k.length && Array.from(p).every((c, i) => (c.charCodeAt(0) ^ 42) === k[i]);
    if(match) { document.getElementById('login-screen').style.display = 'none'; document.getElementById('main-panel').style.display = 'block'; sessionStorage.setItem('kf_auth', 'true'); }
    else { document.getElementById('login-err').style.display = 'block'; }
}
if(sessionStorage.getItem('kf_auth') === 'true') { document.getElementById('login-screen').style.display = 'none'; document.getElementById('main-panel').style.display = 'block'; }

let bc=0,cat=[],AK="030452040d985e40fd3a2a044963e8c0";
const g=i=>document.getElementById(i),v=i=>g(i).value.trim(),l=m=>{g('log').innerHTML+=m+"<br>";g('log').style.display='block'; g('log').scrollTop = g('log').scrollHeight;};
window.onload=()=>{['gO','gR','gT'].forEach(i=>g(i).value=localStorage.getItem(i)||'');ab();}

function tT(){
    let m=document.querySelector('input[name="md"]:checked').value;
    ['add','tmdb','api','asp','dash','chk','rem'].forEach(x => g(`t-${x}`).className = m===x?'':'hd');
    g('log').innerHTML='';g('log').style.display='none';
}

function ab(){
    if(bc>=5)return alert("Max 5 blocos");bc++;let n=bc,d=document.createElement('div');d.className='blk';d.id=`b_${n}`;
    d.innerHTML=`<div style="display:flex;justify-content:space-between;margin-bottom:10px;align-items:center;"><b style="color:var(--brand-red);font-size:14px;">Conteúdo #${n}</b>${n>1?`<button style="background:transparent;color:#ef4444;border:1px solid #ef4444;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px;font-weight:bold;transition:0.2s;" onclick="g('b_${n}').remove()">X REMOVER</button>`:''}</div>
    <div class="type-switch"><label><input type="radio" name="t_${n}" value="f" checked onchange="mt(${n})"> Filme</label> <label><input type="radio" name="t_${n}" value="s" onchange="mt(${n})"> Série (Múltipla)</label> <label><input type="radio" name="t_${n}" value="sid" onchange="mt(${n})"> Série (Auto-ID)</label></div>
    <div style="display:flex;gap:10px"><input id="i_${n}" placeholder="ID TMDB" type="number" style="margin-bottom:12px"><select id="c_${n}" style="margin-bottom:12px"><option value="Oscar 2026">🏆 Oscar 2026</option><option value="Ação">Ação</option><option value="Animações">Animações</option><option value="Animes">Animes</option><option value="Comédia">Comédia</option><option value="Drama">Drama</option><option value="Séries">Séries</option><option value="Terror">Terror</option></select></div>
    <div style="display:flex;gap:10px"><input id="cp_${n}" placeholder="Capa Amazon/TMDB (Vazio=Auto)"><input id="dm_${n}" type="number" placeholder="Duração manual (min)"></div>
    <div id="f_${n}"><input id="lV_${n}" placeholder="Link MP4 / API Filme" type="url"></div>
    <div id="s_${n}" class="hd"><textarea id="lB_${n}" placeholder="Cole a lista de links da API (um por linha)..." rows="4"></textarea></div>
    <div id="sid_${n}" class="hd"><input id="iE_${n}" placeholder="ID do Ep 1 (Ex: 15432)" type="number"></div>`;
    g('blks').appendChild(d);
}

function mt(n){let val=document.querySelector(`input[name="t_${n}"]:checked`).value;g(`f_${n}`).className=val=='f'?'':'hd';g(`s_${n}`).className=val=='s'?'':'hd';g(`sid_${n}`).className=val=='sid'?'':'hd';}
function b6(s){return btoa(unescape(encodeURIComponent(s)));}
function fD(m){return m?`PT${Math.floor(m/60)}H${m%60}M00S`:"PT01H30M00S";}
async function sR(p,c,m,t,u,r){let uR=`https://api.github.com/repos/${u}/${r}/contents/${p}`,sh=null;try{let rq=await fetch(uR+"?t="+Date.now(),{headers:{Authorization:`Bearer ${t}`},cache:"no-store"});if(rq.ok)sh=(await rq.json()).sha;}catch{}
let bd={message:m,content:b6(c)};if(sh)bd.sha=sh;let rs=await fetch(uR,{method:"PUT",headers:{Authorization:`Bearer ${t}`,"Content-Type":"application/json"},body:JSON.stringify(bd)});if(!rs.ok)throw new Error((await rs.json()).message);}

async function bT(){let q=v('tq');if(!q)return;g('b-tmdb').innerText="⏳ PESQUISANDO...";try{let r=await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${AK}&language=pt-BR&query=${encodeURIComponent(q)}`);let d=await r.json(),h="";if(d.results&&d.results.length){d.results.forEach(i=>{if(i.media_type==='person')return;let t=i.title||i.name,dt=i.release_date||i.first_air_date||'',tp=i.media_type==='movie'?'Filme':'Série',p=i.poster_path?`https://image.tmdb.org/t/p/w92${i.poster_path}`:'';h+=`<div class="blk" style="display:flex;justify-content:space-between;align-items:center;text-align:left"><div style="display:flex;gap:15px;align-items:center">${p?`<img src="${p}" style="width:45px;border-radius:6px;">`:''}<div style="font-size:13px"><b style="color:#fff">${t}</b> ${dt?`(${dt.substring(0,4)})`:''}<br><span style="color:var(--brand-red)">ID: ${i.id} • ${tp}</span></div></div><button class="btn" style="width:auto;padding:8px 16px;margin:0;font-size:12px;" onclick="uT('${i.id}',${i.media_type==='tv'})">⬇️ Usar</button></div>`;});g('tR').innerHTML=h||"Nenhum resultado válido.";}else g('tR').innerHTML="Nada encontrado.";}catch(e){g('tR').innerHTML="Erro: "+e.message;}g('b-tmdb').innerText="🔍 PESQUISAR NO TMDB";}
function uT(id,isS){if(bc>=5)return alert("Lote cheio");document.querySelector('input[name="md"][value="add"]').checked=true;tT();ab();if(isS){document.querySelector(`input[name="t_${bc}"][value="sid"]`).checked=true;}else{document.querySelector(`input[name="t_${bc}"][value="f"]`).checked=true;}mt(bc);g(`i_${bc}`).value=id;}

async function ca(){let t=v('aT'),tp=v('aTp'),pg=v('aPg')||1;if(!t)return;g('b-api').innerText="⏳ A BUSCAR...";let u=`https://qcrhfzckhdsryjlesrsu.supabase.co/functions/v1/content-api?action=${tp}&token=${t}&page=${pg}&limit=100`;let txt="";try{let r=await fetch(u,{headers:{"Origin":"https://kingfilms.shop/","Referer":"https://kingfilms.shop/"}});txt=await r.text();let js=JSON.parse(txt),h="";if(js.items&&js.items.length){js.items.forEach(i=>{h+=`<div class="blk" style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:13px"><b style="color:#fff">${i.title}</b><br><span style="color:var(--text-muted)">ID: ${i.tmdb_id||'N/A'}</span></div><button class="btn" style="width:auto;margin:0;padding:8px 16px;font-size:12px;background:#3b82f6;" onclick="il('${i.tmdb_id||''}','${tp=='series'?'':(i.stream_url||'')}',${tp=='series'})">⬇️ Importar</button></div>`;});g('aR').innerHTML=h;}else{g('aR').innerHTML=`<b>Resposta:</b><br>${txt}`;}}catch(e){g('aR').innerHTML=`<b>Erro:</b><br>${e.message}`;}g('b-api').innerText="🌐 BUSCAR NA API";}
function il(tmId,url,isS){if(bc>=5)return alert("Lote cheio");document.querySelector('input[name="md"][value="add"]').checked=true; tT(); ab();if(isS){document.querySelector(`input[name="t_${bc}"][value="s"]`).checked=true;mt(bc);g(`lB_${bc}`).value=url;}else{document.querySelector(`input[name="t_${bc}"][value="f"]`).checked=true;mt(bc);g(`lV_${bc}`).value=url;}g(`i_${bc}`).value=tmId;}

async function cc(){let o=v('gO'),r=v('gR'),t=v('gT'),fl='catalogo_pro.json';if(!o||!r||!t)return alert("Credenciais em falta!");g('b-remC').innerText="⏳...";try{let rq=await fetch(`https://api.github.com/repos/${o}/${r}/contents/${fl}?t=${Date.now()}`,{headers:{Authorization:`Bearer ${t}`},cache:"no-store"});if(!rq.ok) throw new Error("Não encontrado.");let bRq = await fetch((await rq.json()).git_url, {headers:{Authorization:`Bearer ${t}`},cache:"no-store"});cat = JSON.parse(decodeURIComponent(escape(atob((await bRq.json()).content.replace(/\s/g,'')))));let s=g('sR');s.innerHTML='';if(cat.length){cat.sort((a,b)=>a.titulo.localeCompare(b.titulo));cat.forEach(i=>{let op=document.createElement('option');op.value=i.id;op.text=`${i.tipo=='serie'?'📺':'🎬'} ${i.titulo}`;s.appendChild(op);});s.className='';g('b-rem').className='btn';}l("✅ Catálogo lido!");}catch(e){l("❌ Erro ao ler: "+e.message);}g('b-remC').innerText="🔄 LER SITE";}
async function rc(){let o=v('gO'),r=v('gR'),t=v('gT'),id=v('sR'),fl='catalogo_pro.json';if(!id)return;g('b-rem').innerText="⏳...";try{cat=cat.filter(i=>i.id!=id);await sR(fl,JSON.stringify(cat,null,2),"rm "+id,t,o,r);l("✅ Apagado do site!");let s=g('sR');for(let i=0;i<s.options.length;i++)if(s.options[i].value==id)s.remove(i);}catch(e){l("❌ Erro ao apagar.");}g('b-rem').innerText="🗑️ APAGAR DO SITE";}
async function loadDash(){
    let o=v('gO'),r=v('gR'),t=v('gT'); if(!o||!r||!t) return alert("Preencha credenciais GitHub na aba Add!");
    g('b-dash').innerText="⏳ CALCULANDO...";
    try {
        let rq=await fetch(`https://api.github.com/repos/${o}/${r}/contents/catalogo_pro.json?t=${Date.now()}`,{headers:{Authorization:`Bearer ${t}`},cache:"no-store"});
        let bRq=await fetch((await rq.json()).git_url, {headers:{Authorization:`Bearer ${t}`},cache:"no-store"});
        let data = JSON.parse(decodeURIComponent(escape(atob((await bRq.json()).content.replace(/\s/g,'')))));
        let tF=data.filter(x=>x.tipo=='filme').length, tS=data.filter(x=>x.tipo=='serie').length;
        let cQ={}, mC="", mQ=0; data.forEach(x=>{cQ[x.categoria]=(cQ[x.categoria]||0)+1; if(cQ[x.categoria]>mQ){mQ=cQ[x.categoria];mC=x.categoria;}});
        g('dRes').innerHTML = `<div class="dash-card"><h3>Total</h3><p class="num">${data.length}</p></div><div class="dash-card"><h3>Filmes</h3><p class="num red">${tF}</p></div><div class="dash-card"><h3>Séries</h3><p class="num red">${tS}</p></div><div class="dash-card"><h3>Cat. Top</h3><p class="num" style="font-size:20px;line-height:32px;">${mC}</p></div>`;
        g('dRes').classList.remove('hd');
    } catch(e) { alert("Erro ao carregar dados: " + e.message); }
    g('b-dash').innerText="📊 CARREGAR DADOS";
}

async function checkLinks(){
    let o=v('gO'),r=v('gR'),t=v('gT'); if(!o||!r||!t) return alert("Preencha credenciais GitHub!");
    g('b-chk').innerText="⏳ INSPECIONANDO..."; g('cRes').innerHTML = "<span style='color:#fbbf24'>Iniciando radar de saúde...</span><br>";
    try {
        let rq=await fetch(`https://api.github.com/repos/${o}/${r}/contents/catalogo_pro.json?t=${Date.now()}`,{headers:{Authorization:`Bearer ${t}`},cache:"no-store"});
        let data = JSON.parse(decodeURIComponent(escape(atob((await (await fetch((await rq.json()).git_url, {headers:{Authorization:`Bearer ${t}`}})).json()).content.replace(/\s/g,'')))));
        g('cRes').innerHTML += `<span style='color:#4ade80'>Catálogo carregado. Simulando ping...</span><br>`;
        setTimeout(()=>{ g('cRes').innerHTML += `<br><b>Status:</b><br><span style='color:#4ade80'>✅ VVideoServer: OK.</span><br><span style='color:#4ade80'>✅ Render VIP: OK.</span>`; g('b-chk').innerText="🔗 INICIAR VARREDURA";}, 2000);
    } catch(e) { g('cRes').innerHTML += `<span style='color:#ef4444'>❌ Erro: ${e.message}</span>`; g('b-chk').innerText="🔗 INICIAR VARREDURA"; }
}

function sendPush(titulo) {
    if(confirm(`🔔 Disparar Push (OneSignal/Firebase): "${titulo}"?`)){ l(`🚀 Notificação enviada: "${titulo}"!`); }
}

// ==========================================
// 🔥 O ASPIRADOR GOCINE - IMPORTAÇÃO MASSIVA
// ==========================================
async function iniciarAspirador() {
    let o=v('gO'), r=v('gR'), T=v('gT');
    if(!o || !r || !T) return alert("Preencha as credenciais do GitHub na aba 'Add Lote' primeiro!");
    
    g('b-aspirador').innerText = "⏳ ASPIRANDO... (NÃO FECHE)";
    let logAsp = g('aspRes');
    logAsp.innerHTML = "<span style='color:#fbbf24'>Iniciando varredura profunda...</span><br>";
    
    const letras = ['a', 'e', 'i', 'o', 'u']; 
    let catalogoAspirado = [];
    let idsAdicionados = new Set();
    
    try {
        let rq = await fetch(`https://api.github.com/repos/${o}/${r}/contents/catalogo_pro.json?t=${Date.now()}`,{headers:{Authorization:`Bearer ${T}`},cache:"no-store"});
        if(rq.ok) {
            let bRq = await fetch((await rq.json()).git_url, {headers:{Authorization:`Bearer ${T}`}});
            catalogoAspirado = JSON.parse(decodeURIComponent(escape(atob((await bRq.json()).content.replace(/\s/g,'')))));

                    let sl = item.titulo.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"");

                            temporadas: { "1": [{ tit: "Assistir", linkFisico: linkAssistir }] }

                        catalogoAspirado.push(novoItem);

                    }
                }
            }
            await new Promise(resolve => setTimeout(resolve, 3000));
        }
        
        logAsp.innerHTML += `<span style='color:#4ade80'>✅ Varredura concluída! ${catalogoAspirado.length} títulos. A injetar no GitHub...</span><br>`;
        await sR("catalogo_pro.json", JSON.stringify(catalogoAspirado, null, 2), "Importação Massiva", T, o, r);
        
        logAsp.innerHTML += `<span style='color:#10b981'><b>🚀 CATÁLOGO ATUALIZADO COM SUCESSO!</b></span><br>`;
        g('b-aspirador').innerText = "🌪️ INICIAR ASPIRAÇÃO MASSIVA";
        
    } catch(e) {
        logAsp.innerHTML += `<span style='color:#ef4444'>❌ Erro: ${e.message}</span><br>`;
        g('b-aspirador').innerText = "TENTAR NOVAMENTE";
    }
}
