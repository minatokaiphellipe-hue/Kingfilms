<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KINGFILMS - O Melhor do Streaming</title>
    <meta name="description" content="Assista séries, filmes e animes online em HD no KINGFILMS.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌀</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@400;700;800;900&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

    <style>
        /* --- ESTILOS GERAIS E SEGURANÇA --- */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #071022 0%, #000000 100%); background-attachment: fixed; min-height: 100vh; color: #ffffff; overflow-x: hidden; padding-bottom: 80px;
            /* Anti-Roubo: Impede seleção de texto */
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
        }
        
        /* Permite selecionar texto apenas nos inputs */
        input, textarea, select { -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text; }
        img { -webkit-user-drag: none; pointer-events: none; }
        
        h1, h2, h3, .logo-premium, .hero-title, .showcase-title, .tg-title, .categoria-title { font-family: 'Outfit', sans-serif; }

        /* --- TELA DE LOGIN VIP --- */
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7, 16, 34, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s, visibility 0.5s; overflow-y: auto; padding: 20px; }
        .login-overlay.hidden { opacity: 0; visibility: hidden; }
        .login-title { font-size: 28px; font-weight: 800; color: #fff; margin-bottom: 20px; letter-spacing: 1px; text-align: center; }
        .auth-form { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 320px; margin: 0 auto; }
        
        .btn-google { background: #ffffff; color: #444; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Outfit', sans-serif; }
        .btn-google:hover, .btn-google:focus { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,255,255,0.2); outline: none; }
        
        .auth-msg { color: #ff4b4b; font-size: 14px; text-align: center; margin-top: 10px; min-height: 20px; font-weight: bold; }
        .btn-skip { margin-top: 30px; background: transparent; color: #aaa; border: 1px solid #555; padding: 10px 25px; border-radius: 30px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; outline: none; font-family: 'Outfit', sans-serif;}
        .btn-skip:hover, .btn-skip:focus { background: rgba(255,255,255,0.1); color: #fff; border-color: #fff; }

        /* 🌌 CABEÇALHO GLASSMORPHISM */
        .header-premium { display: flex; justify-content: space-between; align-items: center; padding: 12px 5%; background: rgba(2, 5, 10, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 30px rgba(0,0,0,0.8); }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .header-right { display: flex; align-items: center; gap: 20px; }
        
        .logo-premium { font-size: 28px; font-weight: 900; text-transform: uppercase; letter-spacing: -1px; cursor: pointer; margin: 0; background: linear-gradient(to right, #ffffff 30%, #e50914 90%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; transition: opacity 0.3s ease; outline: none; }
        .logo-premium:hover, .logo-premium:focus { opacity: 0.8; }
        /* BARRA DE PESQUISA */
        .search-container { position: relative; display: flex; align-items: center; }
        .search-input { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 10px 15px 10px 45px; border-radius: 30px; font-size: 14px; outline: none; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); width: 40px; cursor: pointer; color: transparent; backdrop-filter: blur(5px); }
        .search-input:focus, .search-input:not(:placeholder-shown) { border-color: #e50914; width: 250px; background: rgba(20,0,0,0.8); cursor: text; color: #fff; box-shadow: 0 0 20px rgba(229,9,20,0.4); padding-left: 45px; }
        .search-icon { position: absolute; left: 14px; font-size: 16px; color: #aaa; transition: 0.3s; pointer-events: none; }
        .search-input:focus ~ .search-icon, .search-input:not(:placeholder-shown) ~ .search-icon { color: #e50914; filter: drop-shadow(0 0 5px rgba(229,9,20,0.5)); }

        /* 📱 BARRA DE NAVEGAÇÃO INFERIOR */
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #111111; display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; border-radius: 40px; width: 95%; max-width: 500px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); border: 1px solid rgba(255,255,255,0.08); z-index: 2000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #6b6b6b; cursor: pointer; transition: 0.3s; outline: none; background: transparent; border: none; padding: 5px; }
        .nav-item.active { color: #ffffff; }
        .nav-item:hover { color: #aaaaaa; }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; transition: 0.3s; }
        .nav-item.active svg { transform: scale(1.1); filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }
        .nav-item span { font-size: 10px; font-weight: 700; font-family: 'Inter', sans-serif; letter-spacing: 0.3px; }

        /* 🗂️ MODAL DO CATÁLOGO */
        .catalog-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7, 16, 34, 0.98); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 1500; display: flex; flex-direction: column; align-items: center; padding: 50px 5%; overflow-y: auto; transition: 0.4s cubic-bezier(0.25, 1, 0.5, 1); opacity: 0; visibility: hidden; transform: translateY(20px); }
        .catalog-overlay.open { opacity: 1; visibility: visible; transform: translateY(0); }
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; width: 100%; max-width: 800px; margin-bottom: 40px; }
        .cat-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 16px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.3s; text-align: center; outline: none; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .cat-btn:hover, .cat-btn:focus { background: #e50914; border-color: #e50914; transform: translateY(-3px); box-shadow: 0 8px 20px rgba(229,9,20,0.4); }

        /* 🎬 PÁGINA DE DETALHES */
        .detalhes-hero { position: relative; width: 100%; height: 60vh; min-height: 450px; background-size: cover; background-position: center top; margin-top: -5px; }
        .detalhes-overlay { position: absolute; inset: 0; background: linear-gradient(to top, #071022 0%, rgba(7,16,34,0.6) 50%, rgba(0,0,0,0.1) 100%); z-index: 1; pointer-events: none;}
        
        /* 🔥 CORREÇÃO: CONTAINER PARA BOTÃO VOLTAR E FAVORITAR NOS CANTOS OPOSTOS */
        .detalhes-header-nav { position: absolute; top: 25px; left: 0; width: 100%; padding: 0 5%; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
        
        /* Botão Voltar Perfeito */
        .btn-voltar-topo { position: relative; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 10px 22px; border-radius: 30px; cursor: pointer; font-weight: 700; font-size: 13px; backdrop-filter: blur(10px); transition: all 0.3s ease; outline: none; font-family: 'Inter', sans-serif; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .btn-voltar-topo:hover, .btn-voltar-topo:focus { background: rgba(255,255,255,0.15); color: #fff; border-color: #fff; transform: scale(1.05); }
        
        /* Botão Favoritar Perfeito */
        .btn-flutuante { position: relative; padding: 10px 22px; border-radius: 30px; cursor: pointer; font-weight: 800; font-size: 13px; transition: all 0.3s ease; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); outline: none; font-family: 'Outfit', sans-serif; display: inline-block;}
        .btn-flutuante:hover, .btn-flutuante:focus { transform: scale(1.05); }
        .btn-flutuante.in-list { background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.3); color: #fff; }
        .btn-flutuante.not-in-list { background: #fff; border: 1px solid #fff; color: #000; }

        .detalhes-content { position: absolute; bottom: 0; left: 0; width: 100%; padding: 0 5% 30px 5%; z-index: 10; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .detalhes-title-img { max-width: 80%; max-height: 180px !important; object-fit: contain; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8)); margin-bottom: 20px; display: block; pointer-events: none;}
        .detalhes-title-text { font-size: 3rem; font-family: 'Outfit', sans-serif; font-weight: 900; margin: 0 0 15px 0; text-shadow: 0 4px 20px rgba(0,0,0,0.9); line-height: 1.1; letter-spacing: -1px; }
        .detalhes-meta-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; font-size: 13px; flex-wrap: wrap; text-shadow: 1px 1px 4px rgba(0,0,0,0.8); }
        .detalhes-synopsis { color: #cbd5e1; font-size: 1rem; line-height: 1.6; font-weight: 400; max-width: 800px; text-shadow: 1px 1px 5px rgba(0,0,0,0.9); margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;}
        
        .detalhes-body { max-width: 1000px; margin: 0 auto; padding: 30px 5%; }
        
        /* 📺 LISTA DE EPISÓDIOS */
        .season-tabs-container { display: flex; overflow-x: auto; gap: 12px; margin-bottom: 20px; padding-bottom: 5px; scrollbar-width: none; }
        .season-tabs-container::-webkit-scrollbar { display: none; }
        .season-btn { background: rgba(255, 255, 255, 0.05); color: #aaa; border: 1px solid rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: all 0.3s ease; outline: none; font-family: 'Outfit', sans-serif; }
        .season-btn.active { background: #e50914; color: #fff; border-color: transparent; }

        .ep-list-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .ep-card { display: flex; flex-direction: column; align-items: center; text-align: center; background: rgba(20, 25, 35, 0.8); padding: 15px; border-radius: 16px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s ease; outline: none; }
        .ep-card:hover, .ep-card:focus { transform: translateY(-5px); background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .ep-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); flex-shrink: 0; background: #111; pointer-events: none; margin-bottom: 12px; }
        .ep-info { flex: 1; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .ep-title { font-size: 16px; margin-bottom: 12px; color: #fff; font-weight: 700; font-family: 'Outfit', sans-serif; }
        .ep-play-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #fff; padding: 10px 30px; border-radius: 30px; font-size: 13px; font-weight: 800; color: #000; box-shadow: 0 4px 10px rgba(255,255,255,0.2); font-family: 'Outfit', sans-serif; transition: 0.3s; width: auto; margin: 0 auto; }
        .ep-card:hover .ep-play-btn { transform: scale(1.05); background: #e50914; color: #fff; box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4); }
        /* --- HERO SLIDER --- */
        .hero-slider-wrapper { position: relative; width: 100%; height: 70vh; min-height: 480px; max-height: 700px; margin-bottom: 30px; }
        .hero-slider { position: absolute; inset: 0; overflow: hidden; background: #000; touch-action: pan-y; }
        .hero-slide { position: absolute; inset: 0; background-size: cover; background-position: center top; opacity: 0; transform: scale(1.05); transition: opacity 0.8s ease-in-out, transform 8s linear; display: flex; align-items: flex-end; z-index: 0; }
        .hero-slide.active { opacity: 1; transform: scale(1); z-index: 1; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, #071022 0%, rgba(7, 16, 34, 0.6) 40%, rgba(0,0,0,0.1) 100%), linear-gradient(to right, #071022 0%, transparent 60%); z-index: 1; pointer-events: none; }
        
        .hero-content { position: relative; z-index: 2; padding: 40px 5%; width: 100%; max-width: 800px; padding-bottom: 75px; pointer-events: auto; display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
        .hero-title-img { max-width: 70%; max-height: 120px; object-fit: contain; margin-bottom: 15px; filter: drop-shadow(0 8px 15px rgba(0,0,0,0.9)); pointer-events: none; }
        .hero-title { font-size: 3.5rem; font-weight: 900; margin-bottom: 12px; letter-spacing: -2px; text-shadow: 0 4px 20px rgba(0,0,0,0.9); line-height: 1.1; }
        
        .hero-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; font-size: 13px; font-weight: 700; text-shadow: 1px 1px 4px rgba(0,0,0,0.8); }
        .hero-synopsis { font-size: 1rem; color: #e2e8f0; margin-bottom: 25px; line-height: 1.5; font-weight: 400; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 1px 1px 5px rgba(0,0,0,0.9); }
        
        .hero-buttons { display: flex; gap: 15px; }
        .btn-hero-play { background: #fff; color: #000; padding: 12px 30px; border-radius: 30px; font-weight: 800; font-size: 15px; cursor: pointer; border: 0; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2); outline: none; font-family: 'Outfit', sans-serif; }
        .btn-hero-play:hover, .btn-hero-play:focus { transform: scale(1.05); background: #e50914; color: #fff; box-shadow: 0 8px 25px rgba(229, 9, 20, 0.5); }
        .btn-hero-info { background: rgba(109, 109, 110, 0.7); color: #fff; padding: 12px 30px; border-radius: 30px; font-weight: 700; font-size: 15px; cursor: pointer; border: none; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); outline: none; font-family: 'Outfit', sans-serif;}
        .btn-hero-info:hover, .btn-hero-info:focus { background: rgba(109, 109, 110, 0.9); transform: scale(1.05); }

        .hero-slider-wrapper .slider-dots { position: absolute; bottom: 30px; left: 5%; z-index: 10; display: flex; gap: 8px; }
        .hero-slider-wrapper .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.3); cursor: pointer; transition: all 0.4s ease; outline: none; }
        .hero-slider-wrapper .dot.active { background: #e50914; width: 30px; border-radius: 5px; box-shadow: 0 0 10px rgba(229,9,20,0.5); }

        /* 🖼️ SHOWCASE E CAPAS NORMAIS */
        .showcase-slider-container { width: 100%; position: relative; height: 530px; margin-bottom: 40px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .showcase-track { position: relative; width: 100%; max-width: 900px; height: 100%; display: flex; justify-content: center; }
        .showcase-slide { position: absolute; top: 15px; left: calc(50% - 130px); width: 260px; height: 100%; transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1); opacity: 0; z-index: 0; transform: scale(0.7) translateX(0); pointer-events: none; display: flex; flex-direction: column; align-items: center; outline: none; }
        .showcase-slide.active { opacity: 1; transform: scale(1) translateX(0); z-index: 3; pointer-events: auto; }
        .showcase-slide.prev { opacity: 0.5; transform: scale(0.85) translateX(-95%); z-index: 2; pointer-events: auto; cursor: pointer; }
        .showcase-slide.next { opacity: 0.5; transform: scale(0.85) translateX(95%); z-index: 2; pointer-events: auto; cursor: pointer; }
        
        .showcase-img-box { width: 100%; aspect-ratio: 2/3; border-radius: 16px; overflow: hidden; position: relative; cursor: pointer; border: 2px solid #ff1e2a; box-shadow: 0 0 15px rgba(255, 30, 42, 0.5); transition: all 0.4s ease; }
        .showcase-img-box img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; pointer-events: none;}
        .showcase-slide.active .showcase-img-box:hover img, .showcase-slide.active:focus .showcase-img-box img { transform: scale(1.05); filter: brightness(70%); }
        .showcase-slide.active .showcase-img-box:hover, .showcase-slide.active:focus .showcase-img-box { box-shadow: 0 0 25px rgba(255, 30, 42, 1), 0 0 50px rgba(255, 30, 42, 0.6); }
        .showcase-play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); width: 70px; height: 70px; background: rgba(229, 9, 20, 0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0; transition: all 0.3s ease; z-index: 5; pointer-events: none; box-shadow: 0 0 20px rgba(229, 9, 20, 0.6); }
        .showcase-slide.active .showcase-play-icon { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .showcase-play-icon::after { content: ''; margin-left: 6px; border-style: solid; border-width: 14px 0 14px 22px; border-color: transparent transparent transparent #fff; }
        .showcase-slide.active .showcase-img-box:hover .showcase-play-icon, .showcase-slide.active:focus .showcase-play-icon { transform: translate(-50%, -50%) scale(1.15); background: #fff; box-shadow: 0 0 30px rgba(255, 255, 255, 0.8); }
        .showcase-slide.active .showcase-img-box:hover .showcase-play-icon::after, .showcase-slide.active:focus .showcase-play-icon::after { border-color: transparent transparent transparent #e50914; }
        
        .showcase-content { width: 100%; padding: 15px 0 0 0; display: flex; flex-direction: column; align-items: center; text-align: center; opacity: 0; transition: opacity 0.3s; }
        .showcase-slide.active .showcase-content { opacity: 1; transition-delay: 0.2s; }
        .showcase-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 6px; color: #fff; letter-spacing: -0.2px; text-shadow: 0 2px 5px rgba(0,0,0,0.8); line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .showcase-title-img { height: 45px !important; width: auto !important; max-width: 90% !important; object-fit: contain; margin-bottom: 10px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8)); display: block; pointer-events: none; }
        .showcase-meta { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 600; color: #aaa; }
        .showcase-slider-container .slider-dots { position: absolute; bottom: 0; left: 0; width: 100%; margin-top: 15px; display: flex; justify-content: center; gap: 8px;}

        /* BANNERS, CARDS E FOOTER */
        .telegram-banner { background: linear-gradient(135deg, #0088cc 0%, #004466 100%); border-radius: 16px; padding: 25px; margin: 10px 5% 35px 5%; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 10px 30px rgba(0, 136, 204, 0.4); border: 1px solid rgba(0, 170, 255, 0.5); flex-wrap: wrap; gap: 15px; transition: 0.3s; }
        .telegram-banner:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0, 136, 204, 0.6); }
        .tg-text { flex: 1; min-width: 200px; }
        .tg-title { font-size: 20px; font-weight: 900; color: #fff; margin-bottom: 5px; display: flex; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .tg-desc { font-size: 14px; color: #ccebff; font-weight: 600; line-height: 1.4; }
        .tg-btn { background: #fff; color: #006699; padding: 14px 30px; border-radius: 30px; font-weight: 900; text-decoration: none; text-transform: uppercase; font-size: 14px; transition: 0.3s; display: inline-block; text-align: center; outline: none; font-family: 'Outfit', sans-serif;}
        .tg-btn:hover, .tg-btn:focus { transform: scale(1.05); box-shadow: 0 6px 20px rgba(255,255,255,0.4); background: #e6f5ff; color: #0088cc; }
        
        .top10-section { margin-bottom: 50px; }
        .top10-row { display: flex; overflow-x: auto; gap: 30px; padding: 10px 5% 30px 5%; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .top10-row::-webkit-scrollbar { display: none; }
        .top10-card { flex: 0 0 210px; position: relative; display: flex; align-items: center; justify-content: flex-end; cursor: pointer; scroll-snap-align: start; transition: transform 0.4s; outline: none; }
        .top10-card:hover, .top10-card:focus { transform: scale(1.08); z-index: 10; }
        .top10-number { position: absolute; left: -25px; bottom: -15px; font-size: 180px; font-weight: 900; font-family: 'Outfit', sans-serif; color: #0b0f19; -webkit-text-stroke: 2px rgba(255,255,255,0.1); z-index: 1; line-height: 1; transition: 0.4s; letter-spacing: -10px; text-shadow: 10px 0 20px rgba(0,0,0,0.9); }
        .top10-card:hover .top10-number, .top10-card:focus .top10-number { color: #111; -webkit-text-stroke: 2px #fff; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
        .top10-card:nth-child(10) .top10-number { letter-spacing: -18px; left: -50px; }

    if(todosDados.length<10)return"";let d=new Date(),s=Math.ceil((((d-new Date(Date.UTC(d.getUTCFullYear(),0,1)))/86400000)+1)/7)+d.getFullYear(),r=function(){let x=Math.sin(s++)*10000;return x-Math.floor(x);},em=[...todosDados];
    for(let i=em.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[em[i],em[j]]=[em[j],em[i]];}
    let t10=em.slice(0,10),h=`<div class="top10-section"><h2 class="categoria-title">🔥 TOP 10 da Semana</h2><div class="top10-row">`;
    t10.forEach((i,x)=>{h+=`<div class="top10-card" tabindex="0" onclick="abrirDetalhes('${i.id}')" onkeypress="if(event.key === 'Enter') abrirDetalhes('${i.id}')"><div class="top10-number">${x+1}</div><div class="top10-img-box"><img src="${i.logo}" alt="${i.titulo}" loading="lazy"></div></div>`;});return h+`</div></div>`;
  }
  hFeed+=gerarTop10();

  // RESTAURO DO SHOWCASE NEON 3D
  if(todosDados.length > 5){
    let destShowcase = todosDados.slice(5, 9);
    if(destShowcase.length < 4) destShowcase = todosDados.slice(0, 4);
    
    hFeed+=`<div class="showcase-slider-container" id="showcaseSlider"><div class="showcase-track" id="showcaseTrack">`;
    destShowcase.forEach((d,i)=>{
      let tC=d.classificacao||"L";if(tC==="Livre"||tC==="L"){tC="Livre";}
      let nH=d.avaliacao&&d.avaliacao!=="0.0"&&d.avaliacao!=="N/A"?d.avaliacao:"";
      let tituloHeroHTML = d.logo_png ? `<img src="${d.logo_png}" alt="${d.titulo}" class="showcase-title-img">` : `<h1 class="showcase-title">${d.titulo.replace(" 🌀","")}</h1>`;
      let classCSS = "";
      if(i === 0) classCSS = "active"; else if(i === 1) classCSS = "next"; else if(i === destShowcase.length - 1) classCSS = "prev";

      hFeed+=`<div class="showcase-slide ${classCSS}" tabindex="0" id="s-slide-${i}" onclick="if(!this.classList.contains('active')) mudarShowcase(${i}); else abrirDetalhes('${d.id}');" onkeypress="if(event.key === 'Enter') { if(!this.classList.contains('active')) mudarShowcase(${i}); else abrirDetalhes('${d.id}'); }"><div class="showcase-img-box"><img src="${d.logo}" alt="${d.titulo}"><div class="showcase-overlay"></div><div class="showcase-play-icon"></div></div><div class="showcase-content">${tituloHeroHTML}<div class="showcase-meta"><span style="border:1px solid rgba(255,255,255,0.2); padding:2px 8px; border-radius:6px; color:#fff;">${tC}</span><span class="showcase-meta-divider">|</span><span>${d.tipo==='filme'?'Filme':'Série'}</span>${nH?`<span class="showcase-meta-divider">|</span><span style="color:#f5c518;">★</span> ${nH}`:''}</div></div></div>`;
    });
    hFeed+=`</div><div class="slider-dots">`;
    destShowcase.forEach((_,i)=>{hFeed+=`<div class="dot ${i===0?'active':''}" tabindex="0" id="s-dot-${i}" onclick="mudarShowcase(${i})" onkeypress="if(event.key === 'Enter') mudarShowcase(${i})"></div>`;});
    hFeed+=`</div></div>`;
  }

  let rec=todosDados.slice(0,10);hFeed+=`<div class="categoria-section" id="recem-adicionados"><h2 class="categoria-title">🔥 Lançamentos</h2><div class="content-row">`;rec.forEach(i=>{hFeed+=criarCartaoHTML(i,false);});hFeed+=`</div></div>`;
  
  cats.forEach(c=>{if(c.toLowerCase().includes('oscar'))return;let idS=c.replace(/\s+/g,'-').toLowerCase(),iCat=todosDados.filter(i=>(i.categoria||'Outros')===c),iCar=iCat.slice(0,10);hFeed+=`<div class="categoria-section" id="${idS}"><h2 class="categoria-title">${c.toUpperCase()}</h2><div class="content-row">`;iCar.forEach(i=>{hFeed+=criarCartaoHTML(i,false);});hFeed+=`</div>`;if(iCat.length>10)hFeed+=`<button class="btn-ver-mais-barra" tabindex="0" onclick="verCategoriaCompleta('${c}')">Ver Mais ▾</button>`;hFeed+=`</div>`;});
  
  f.innerHTML=hFeed;

  setTimeout(()=>{ 
      if(todosDados.length>0) iniciarHero(5);
      if(todosDados.length>5) iniciarShowcase(4);
      configurarSwipe();
  }, 100);
}

function renderizarFavoritos() {
    history.pushState(null, '', window.location.pathname); historicoNav.push({t:'f'});
    clearInterval(heroInt); clearInterval(showInt);
    let f = document.getElementById('feedPrincipal');
    let itensLista = minhaLista.map(id => todosDados.find(i=>i.id===id)).filter(i=>i);
    
    if(itensLista.length === 0) {
        f.innerHTML = `<div style="padding:15px 5%;"><h2 class="categoria-title" style="margin-left:0;margin-top:20px;">❤️ Meus Favoritos</h2></div><div style="text-align:center;margin-top:80px;color:#888;"><span style="font-size:55px;">💔</span><br><br><p style="font-size:18px;">Nenhum título favoritado ainda.</p></div>`;
        return;
    }
    
    let h = `<div style="padding:15px 5%;"><h2 class="categoria-title" style="margin-left:0;margin-top:20px;">❤️ Meus Favoritos</h2></div><div class="grid-view" id="gridResultados">`;
    itensLista.forEach(i => { h += criarCartaoHTML(i, false); });
    h += `</div>`;
    f.innerHTML = h;
    window.scrollTo({top:0, behavior:'smooth'});
}

window.iniciarHero = function(t){ totHero=t; currHero=0; clearInterval(heroInt); if(t>1) heroInt=setInterval(()=>{mudarHero((currHero+1)%totHero);}, 8000); };
window.mudarHero = function(i){
    let s=document.querySelectorAll('.hero-slide'), d=document.querySelectorAll('#heroSliderWrapper .dot');
    if(!s.length||!d.length)return;
    s.forEach(e=>e.classList.remove('active')); d.forEach(e=>e.classList.remove('active'));
    document.getElementById(`h-slide-${i}`).classList.add('active');
    document.getElementById(`h-dot-${i}`).classList.add('active');
    currHero=i; clearInterval(heroInt); heroInt=setInterval(()=>{mudarHero((currHero+1)%totHero);}, 8000);
};

window.iniciarShowcase = function(t){ totShow=t; currShow=0; clearInterval(showInt); if(t>1) showInt=setInterval(()=>{mudarShowcase((currShow+1)%totShow);}, 6000); };
window.mudarShowcase = function(i){
    let s = document.querySelectorAll('.showcase-slide'), d = document.querySelectorAll('#showcaseSlider .dot');
    if(!s.length || !d.length) return;
    s.forEach(e => e.classList.remove('active', 'prev', 'next')); d.forEach(e => e.classList.remove('active'));
    let prevIdx = (i - 1 + totShow) % totShow; let nextIdx = (i + 1) % totShow;
    document.getElementById(`s-slide-${prevIdx}`).classList.add('prev'); document.getElementById(`s-slide-${i}`).classList.add('active'); document.getElementById(`s-slide-${nextIdx}`).classList.add('next');
    document.getElementById(`s-dot-${i}`).classList.add('active');
    currShow=i; clearInterval(showInt); showInt=setInterval(()=>{mudarShowcase((currShow+1)%totShow);}, 6000);
};

function configurarSwipe(){
    let hs=document.getElementById('heroSliderWrapper');
    if(hs){
        let sx=0, ex=0;
        hs.addEventListener('touchstart',e=>{sx=e.changedTouches[0].screenX;},{passive:true});
        hs.addEventListener('touchend',e=>{ex=e.changedTouches[0].screenX; if(sx-ex>50) mudarHero((currHero+1)%totHero); else if(ex-sx>50) mudarHero((currHero-1+totHero)%totHero);},{passive:true});
    }
    let ss=document.getElementById('showcaseSlider');
    if(ss){
        let sx=0, ex=0;
        ss.addEventListener('touchstart',e=>{sx=e.changedTouches[0].screenX;},{passive:true});
        ss.addEventListener('touchend',e=>{ex=e.changedTouches[0].screenX; if(sx-ex>50) mudarShowcase((currShow+1)%totShow); else if(ex-sx>50) mudarShowcase((currShow-1+totShow)%totShow);},{passive:true});
    }
}

function verCategoriaCompleta(c,salvar=true){
  if(salvar){history.pushState(null, '', window.location.pathname); historicoNav.push({t:'c',v:c});}
  clearInterval(heroInt); clearInterval(showInt); listaAtual=todosDados.filter(i=>(i.categoria||'Outros')===c);itensExibidos=ITENS_POR_PAGINA;
  let f=document.getElementById('feedPrincipal');
  
  // Alterado para um bloco simples (removido posição absoluta/relativa complexa do botão)
  let h=`
  <div style="padding:20px 5%; display:flex; flex-direction:column; gap:20px;">
      <button class="btn-voltar-topo" tabindex="0" onclick="voltarPagina()" style="align-self: flex-start; position: static;">← Voltar</button>
      <h2 class="categoria-title" style="margin:0;">${getIcon(c)} TUDO EM: ${c.toUpperCase()}</h2>
  </div>
  <div class="grid-view" id="gridResultados">`;
  
  let exibidos=listaAtual.slice(0,itensExibidos);exibidos.forEach(i=>{h+=criarCartaoHTML(i,false);});h+=`</div>`;
  if(listaAtual.length>itensExibidos){h+=`<button id="btnCarregarMais" class="btn-ver-mais-barra" tabindex="0" onclick="carregarMais()">Carregar Mais ▾</button>`;}
  f.innerHTML=h;window.scrollTo({top:0,behavior:'smooth'});
}

function pesquisarConteudo(salvar=true, ignorarPilha=false){
  clearTimeout(timerPesquisa);
  timerPesquisa = setTimeout(() => {
      clearInterval(heroInt); clearInterval(showInt); 
      let t = document.getElementById('campoPesquisa').value.toLowerCase().trim();
      let f = document.getElementById('feedPrincipal');
      
      if(t===""){renderizarHome();return;}
      if(salvar && !ignorarPilha){let ult=historicoNav.length>0?historicoNav[historicoNav.length-1]:null;if(!ult||ult.t!=='b')historicoNav.push({t:'b',v:t});else ult.v=t;}
      
      let tNormalizado = t.normalize("NFD").replace(/[\u0300-\u036f]/g, "");

      listaAtual = todosDados.filter(i => {
          let tituloNormalizado = i.titulo.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
          return tituloNormalizado.includes(tNormalizado);
      });
      
      itensExibidos=ITENS_POR_PAGINA;
      
      let headerHTML = `
      <div style="padding:20px 5%; display:flex; flex-direction:column; gap:20px;">
          <button class="btn-voltar-topo" tabindex="0" onclick="voltarPagina()" style="align-self: flex-start; position: static;">← Voltar</button>
      `;

      if(listaAtual.length===0){
          f.innerHTML= headerHTML + `</div><div style="text-align:center;margin-top:80px;color:#888;"><span style="font-size:55px;">😕</span><br><br><p style="font-size:18px;">Nenhum resultado para "<b>${t}</b>"</p></div>`;
          return;
      }
      
      let h = headerHTML + `<h2 class="categoria-title" style="margin:0;color:#e50914;">Resultados para "${t}"</h2></div><div class="grid-view" id="gridResultados">`;
      let exibidos=listaAtual.slice(0,itensExibidos);exibidos.forEach(i=>{h+=criarCartaoHTML(i,false);});h+=`</div>`;
      
      if(listaAtual.length>itensExibidos){h+=`<button id="btnCarregarMais" class="btn-ver-mais-barra" tabindex="0" onclick="carregarMais()">Carregar Mais ▾</button>`;}
      f.innerHTML=h;
  }, 300); 
}

window.carregarMais = function() {
    let grid=document.getElementById('gridResultados'),btn=document.getElementById('btnCarregarMais'),proximos=listaAtual.slice(itensExibidos,itensExibidos+ITENS_POR_PAGINA),h="";
    proximos.forEach(i=>{h+=criarCartaoHTML(i,false);});grid.insertAdjacentHTML('beforeend',h);itensExibidos+=ITENS_POR_PAGINA;
    if(itensExibidos>=listaAtual.length)btn.style.display='none';
};

function mudarTemporada(id,t){document.querySelectorAll('.season-btn').forEach(b=>b.classList.remove('active'));let b=document.getElementById(`btn-temp-${t}`);if(b){b.classList.add('active');b.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}renderEps(id,t);}

function abrirDetalhes(id, salvarUrl=true){
  if(salvarUrl){history.pushState(null, '', '?id=' + id); historicoNav.push({t:'d',v:id});}
  clearInterval(heroInt); clearInterval(showInt);
  let i=todosDados.find(x=>x.id===id), f=document.getElementById('feedPrincipal');
  let tps=Object.keys(i.temporadas).sort((a,b)=>parseInt(a)-parseInt(b)), sT="";
  
  if(tps.length>1){
      sT=`<div class="season-tabs-container" id="seasonTabsContainer">`;
      tps.forEach((t,x)=>{sT+=`<button class="season-btn ${x===0?'active':''}" tabindex="0" id="btn-temp-${t}" onclick="mudarTemporada('${id}','${t}')" onkeypress="if(event.key === 'Enter') mudarTemporada('${id}','${t}')">Temporada ${t}</button>`;});
      sT+=`</div>`;
  } else { sT=`<input type="hidden" id="tempAtualOculta" value="${tps[0]}">`; }
  
  let cC="#0f0", tC=i.classificacao||"L";
  if(tC==="Livre"||tC==="L"){cC="#10b981";tC="Livre";}else if(tC==="10")cC="#0ea5e9";else if(tC==="12")cC="#f59e0b";else if(tC==="14")cC="#f97316";else if(tC==="16"||tC==="18"||tC.includes("TV-MA")||tC.includes("R"))cC="#ef4444";
  
  let nH=i.avaliacao&&i.avaliacao!=="0.0"&&i.avaliacao!=="N/A"?`<span style="background:rgba(0,0,0,0.6);padding:4px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.2);"><span style="color:#f5c518;font-weight:bold;">★</span> ${i.avaliacao}</span>`:"";
  
  let rel=todosDados.filter(x=>(x.categoria||'Outros')===(i.categoria||'Outros')&&x.id!==i.id).slice(0,10), hR="";
  if(rel.length>0){
      hR=`<div style="margin-top:40px;"><h2 class="categoria-title" style="margin-left:0; border-left:4px solid #e50914; padding-left:10px;">${i.tipo==='serie'?'Séries':'Filmes'} Relacionados</h2><div class="content-row" style="padding:0 0 20px 0;">`;
      rel.forEach(r=>{hR+=criarCartaoHTML(r,false);}); hR+=`</div></div>`;
  }
  
  let tituloDetalheHTML = i.logo_png ? `<img src="${i.logo_png}" alt="${i.titulo}" class="detalhes-title-img">` : `<h1 class="detalhes-title-text">${i.titulo.replace(" 🌀","")}</h1>`;

  // 🔥 BOTÕES DE VOLTAR (ESQUERDA) E FAVORITAR (DIREITA) ISOLADOS
  let inList = minhaLista.includes(id);
  let btnClass = inList ? 'in-list' : 'not-in-list';
  let btnTexto = inList ? '❤️ Favoritado' : '🤍 Favoritar';
  let btnLista = `<button id="btnListaFlutuante" class="btn-flutuante ${btnClass}" style="position: absolute; top: 25px; right: 5%; z-index: 10;" tabindex="0" onclick="addLista('${id}')">${btnTexto}</button>`;

  f.innerHTML=`
  <div class="detalhes-hero" style="background-image:url('${i.logo_horizontal||i.logo}');">
      <div class="detalhes-overlay"></div>
      
      <button class="btn-voltar-topo" style="position: absolute; top: 25px; left: 5%; z-index: 10;" tabindex="0" onclick="voltarPagina()">← Voltar</button>
      ${btnLista}

      <div class="detalhes-content">
          <div class="detalhes-max-width" style="display:flex; flex-direction:column; align-items:center; text-align:center;">
              ${tituloDetalheHTML}
              <div class="detalhes-meta-row">
                  ${nH}
                  <span style="background:${cC};color:#fff;padding:4px 10px;border-radius:6px;font-weight:bold;box-shadow:0 2px 5px rgba(0,0,0,0.3);">${tC}</span>
                  <span style="color:#e2e8f0;background:rgba(255,255,255,0.1);padding:4px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);font-weight:600;">${i.tipo==='filme'?'Filme':'Série'}</span>
              </div>
              <p class="detalhes-synopsis">${i.sinopse||"Assista agora no KINGFILMS."}</p>
          </div>
      </div>
  </div>
  <div class="detalhes-body">
      ${sT}
      <div id="listaEps" class="ep-list-container"></div>
      ${hR} 
  </div>
  `;
  renderEps(id,tps[0]);window.scrollTo({top:0,behavior:'smooth'});
}

function renderEps(id,t){
    let i=todosDados.find(x=>x.id===id);if(!t){let h=document.getElementById('tempAtualOculta');if(h)t=h.value;}if(!t||!i.temporadas[t])return;
    document.getElementById('listaEps').innerHTML=i.temporadas[t].map(e=>`
    <div class="ep-card" tabindex="0" onclick="playVid('${id}', '${e.linkFisico}')" style="display: flex; flex-direction: column; align-items: center; background: rgba(20, 25, 35, 0.8); padding: 15px; border-radius: 16px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); text-align: center;">
        <img src="${e.logoEp}" class="ep-thumb" loading="lazy" style="width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); margin-bottom: 12px; pointer-events: none;">
        <div class="ep-info" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <h4 class="ep-title" style="font-size: 16px; margin-bottom: 12px; color: #fff; font-weight: 700; font-family: 'Outfit', sans-serif;">${e.tit}</h4>
            <div class="ep-play-btn" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #fff; padding: 10px 25px; border-radius: 30px; font-size: 13px; font-weight: 800; color: #000; box-shadow: 0 4px 10px rgba(255,255,255,0.2); font-family: 'Outfit', sans-serif; transition: 0.3s; width: auto;">▶ Assistir</div>
        </div>
    </div>`).join('');
}
</script>
