<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="referrer" content="origin"><title>KF Admin Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-dark: #020617;
        --panel-bg: rgba(30, 41, 59, 0.7);
        --input-bg: #0f172a;
        --border-color: #334155;
        --brand-red: #e50914;
        --brand-red-hover: #b00710;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
    }
    body {
        background: linear-gradient(135deg, #0f172a 0%, var(--bg-dark) 100%);
        color: var(--text-main);
        font-family: 'Poppins', sans-serif;
        padding: 20px 10px;
        text-align: center;
        margin: 0;
        min-height: 100vh;
    }
    .c {
        max-width: 700px;
        margin: auto;
        background: var(--panel-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 25px;
        border-radius: 16px;
        border: 1px solid rgba(255,255,255,0.05);
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    h1 { color: var(--brand-red); margin: 0 0 20px; font-weight: 800; letter-spacing: 1px; text-shadow: 0 2px 10px rgba(229, 9, 20, 0.3); }
    input, select, textarea { width: 100%; padding: 14px; background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 12px; box-sizing: border-box; font-family: 'Poppins', sans-serif; font-size: 14px; transition: all 0.3s ease; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand-red); box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.2); }
    input::placeholder, textarea::placeholder { color: var(--text-muted); }
    .btn { background: linear-gradient(135deg, var(--brand-red), var(--brand-red-hover)); color: #fff; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: 600; font-size: 14px; letter-spacing: 0.5px; margin-bottom: 12px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(229, 9, 20, 0.4); }
    .btn:active { transform: translateY(0); }
    .blk { background: #1e293b; padding: 15px; margin-bottom: 15px; border-radius: 10px; border: 1px solid var(--border-color); border-left: 4px solid var(--brand-red); text-align: left; }
    .hd { display: none; }
    .sw { display: flex; gap: 10px; margin-bottom: 25px; justify-content: center; flex-wrap: wrap; }
    .sw label { background: var(--input-bg); border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 30px; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 5px; }
    .sw input[type="radio"] { display: none; }
    .sw label:has(input:checked) { background: var(--brand-red); border-color: var(--brand-red); color: #fff; box-shadow: 0 4px 10px rgba(229, 9, 20, 0.3); }
    #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0f172a 0%, var(--bg-dark) 100%); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .login-box { background: var(--panel-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 40px 30px; border-radius: 16px; text-align: center; width: 90%; max-width: 400px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); }
    .login-box h1 { font-size: 28px; margin-bottom: 5px; }
    #log { background: #020617; color: #4ade80; font-family: monospace; padding: 15px; border-radius: 8px; font-size: 12px; text-align: left; margin-top: 15px; border: 1px solid #064e3b; }
    .type-switch { display: flex; gap: 15px; margin-bottom: 12px; flex-wrap: wrap; }
    .type-switch label { font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-main); display: flex; align-items: center; gap: 5px;}
    .type-switch input { width: auto; margin: 0; cursor: pointer; accent-color: var(--brand-red); }
</style>
</head>
<body>
<div id="login-screen">
    <div class="login-box">
        <h1>KINGFILMS PRO</h1>
        <p style="color:var(--text-muted);font-size:13px;margin-bottom:25px;">Acesso Criptografado</p>
        <input type="password" id="admin-pwd" placeholder="Digite a Senha Mestra" onkeypress="if(event.key==='Enter') checkPwd()" style="text-align:center;letter-spacing:2px;">
        <button class="btn" onclick="checkPwd()">DESBLOQUEAR COFRE</button>
        <div id="login-err" style="color:#ef4444;margin-top:12px;display:none;font-size:13px;font-weight:600;">❌ Senha Incorreta!</div>
    </div>
</div>

<div class="c" id="main-panel" style="display:none;">
<h1>KINGFILMS PRO</h1>
<div class="sw">
    <label><input type="radio" name="md" value="add" checked onchange="tT()"> ➕ Adicionar Lote</label>
    <label><input type="radio" name="md" value="tmdb" onchange="tT()"> 🔍 Busca TMDB</label>
    <label><input type="radio" name="md" value="api" onchange="tT()"> 🌐 Importar API</label>
    <label><input type="radio" name="md" value="rem" onchange="tT()"> 🗑️ Remover Site</label>
</div>

<div class="blk"><input id="gO" placeholder="User GitHub"><input id="gR" placeholder="Repo GitHub"><input type="password" id="gT" placeholder="Token GitHub"></div>

<div id="t-add">
    <div id="blks"></div>
    <div style="display:flex;gap:10px;">
        <button class="btn" style="background:#334155;color:#fff" onclick="ab()">➕ NOVO BLOCO</button>
        <button class="btn" id="b-add" onclick="p()">🚀 PUBLICAR CONTEÚDO</button>
    </div>
</div>

<div id="t-tmdb" class="hd">
    <div class="blk">
        <input id="tq" placeholder="Digite o nome do Filme ou Série...">
        <button class="btn" style="background:linear-gradient(135deg, #f59e0b, #d97706);color:#fff" id="b-tmdb" onclick="bT()">🔍 PESQUISAR NO TMDB</button>
    </div>
    <div id="tR"></div>
</div>

<div id="t-api" class="hd">
    <div class="blk">
        <input type="password" id="aT" placeholder="Cole o seu Token Secreto da API aqui...">
        <div style="display:flex;gap:10px;margin-bottom:10px">
            <select id="aTp" style="margin-bottom:0"><option value="filmes">Filmes</option><option value="series">Séries</option></select>
            <input id="aPg" type="number" title="Página" value="1" style="width:100px;margin-bottom:0">
        </div>
        <button class="btn" style="background:linear-gradient(135deg, #3b82f6, #2563eb);" id="b-api" onclick="ca()">🌐 BUSCAR NA API</button>
    </div>
    <div id="aR"></div>
</div>
<div id="t-rem" class="hd">
    <div class="blk">
        <button class="btn" style="background:#334155;" id="b-remC" onclick="cc()">🔄 LER SITE</button>
        <select id="sR" class="hd"></select>
        <button class="btn hd" id="b-rem" style="background:linear-gradient(135deg, #ef4444, #b91c1c);" onclick="rc()">🗑️ APAGAR DO SITE</button>
    </div>
</div>

<div id="log" class="hd"></div>
</div>
<script>
function checkPwd() {
    let p = document.getElementById('admin-pwd').value;
    let k = [18, 27, 28, 30, 24, 26, 27, 25, 94, 94]; 
    let match = p.length === k.length && Array.from(p).every((c, i) => (c.charCodeAt(0) ^ 42) === k[i]);
    if(match) { document.getElementById('login-screen').style.display = 'none'; document.getElementById('main-panel').style.display = 'block'; sessionStorage.setItem('kf_auth', 'true'); }
    else { document.getElementById('login-err').style.display = 'block'; }
}
if(sessionStorage.getItem('kf_auth') === 'true') { document.getElementById('login-screen').style.display = 'none'; document.getElementById('main-panel').style.display = 'block'; }

let bc=0,cat=[],AK="030452040d985e40fd3a2a044963e8c0";
const g=i=>document.getElementById(i),v=i=>g(i).value.trim(),l=m=>{g('log').innerHTML+=m+"<br>";g('log').style.display='block'};
window.onload=()=>{['gO','gR','gT'].forEach(i=>g(i).value=localStorage.getItem(i)||'');ab();}
function tT(){let m=document.querySelector('input[name="md"]:checked').value;g('t-add').className=m=='add'?'':'hd';g('t-tmdb').className=m=='tmdb'?'':'hd';g('t-api').className=m=='api'?'':'hd';g('t-rem').className=m=='rem'?'':'hd';g('log').innerHTML='';g('log').style.display='none';}

function ab(){if(bc>=5)return alert("Max 5 blocos");bc++;let n=bc,d=document.createElement('div');d.className='blk';d.id=`b_${n}`;
d.innerHTML=`<div style="display:flex;justify-content:space-between;margin-bottom:10px;align-items:center;"><b style="color:var(--brand-red);font-size:14px;">Conteúdo #${n}</b>${n>1?`<button style="background:transparent;color:#ef4444;border:1px solid #ef4444;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px;font-weight:bold;transition:0.2s;" onclick="g('b_${n}').remove()" onmouseover="this.style.background='#ef4444';this.style.color='#fff';" onmouseout="this.style.background='transparent';this.style.color='#ef4444';">X REMOVER</button>`:''}</div>
<div class="type-switch"><label><input type="radio" name="t_${n}" value="f" checked onchange="mt(${n})"> Filme</label> <label><input type="radio" name="t_${n}" value="s" onchange="mt(${n})"> Série (Lista Múltipla)</label> <label><input type="radio" name="t_${n}" value="sid" onchange="mt(${n})"> Série (Auto-ID API)</label></div>
<div style="display:flex;gap:10px"><input id="i_${n}" placeholder="ID TMDB" type="number" style="margin-bottom:12px"><select id="c_${n}" style="margin-bottom:12px"><option value="Oscar 2026">🏆 Oscar 2026</option><option value="Ação">Ação</option><option value="Animações">Animações</option><option value="Animes">Animes</option><option value="Comédia">Comédia</option><option value="Drama">Drama</option><option value="Fantasia">Fantasia</option><option value="Novelas">Novelas</option><option value="Romance">Romance</option><option value="Séries">Séries</option><option value="Terror">Terror</option></select></div>
<input id="cp_${n}" placeholder="Capa do themoviedb.org (Vazio para automático)">
<div id="f_${n}"><input id="lV_${n}" placeholder="Link MP4 / API Filme" type="url"></div>
<div id="s_${n}" class="hd"><textarea id="lB_${n}" placeholder="Cole AQUI a lista completa de links da API (um por linha)..." rows="4"></textarea></div>
<div id="sid_${n}" class="hd"><input id="iE_${n}" placeholder="ID do Episódio 1 no Servidor (Ex: 15432)" type="number"></div>`;g('blks').appendChild(d);}
    function mt(n){let v=document.querySelector(`input[name="t_${n}"]:checked`).value;g(`f_${n}`).className=v=='f'?'':'hd';g(`s_${n}`).className=v=='s'?'':'hd';g(`sid_${n}`).className=v=='sid'?'':'hd';}
function b6(s){return btoa(unescape(encodeURIComponent(s)));}
function fD(m){return m?`PT${Math.floor(m/60)}H${m%60}M00S`:"PT01H30M00S";}
async function sR(p,c,m,t,u,r){let uR=`https://api.github.com/repos/${u}/${r}/contents/${p}`,sh=null;try{let rq=await fetch(uR+"?t="+Date.now(),{headers:{Authorization:`Bearer ${t}`},cache:"no-store"});if(rq.ok)sh=(await rq.json()).sha;}catch{}
let bd={message:m,content:b6(c)};if(sh)bd.sha=sh;let rs=await fetch(uR,{method:"PUT",headers:{Authorization:`Bearer ${t}`,"Content-Type":"application/json"},body:JSON.stringify(bd)});if(!rs.ok)throw new Error((await rs.json()).message);}

async function bT(){let q=v('tq');if(!q)return;g('b-tmdb').innerText="⏳ PESQUISANDO...";try{let r=await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${AK}&language=pt-BR&query=${encodeURIComponent(q)}`);let d=await r.json(),h="";if(d.results&&d.results.length){d.results.forEach(i=>{if(i.media_type==='person')return;let t=i.title||i.name,dt=i.release_date||i.first_air_date||'',tp=i.media_type==='movie'?'Filme':'Série',p=i.poster_path?`https://image.tmdb.org/t/p/w92${i.poster_path}`:'';h+=`<div class="blk" style="display:flex;justify-content:space-between;align-items:center;text-align:left"><div style="display:flex;gap:15px;align-items:center">${p?`<img src="${p}" style="width:45px;border-radius:6px;box-shadow:0 4px 6px rgba(0,0,0,0.3)">`:''}<div style="font-size:13px;line-height:1.5"><b style="color:#fff;font-size:14px;">${t}</b> ${dt?'<span style="color:var(--text-muted)">('+dt.substring(0,4)+')</span>':''}<br><span style="color:var(--brand-red);font-size:12px;font-weight:600;">ID: ${i.id} &bull; ${tp}</span></div></div><button class="btn" style="width:auto;padding:8px 16px;margin:0;font-size:12px;" onclick="uT('${i.id}',${i.media_type==='tv'})">⬇️ Usar</button></div>`;});g('tR').innerHTML=h||"Nenhum resultado válido.";}else g('tR').innerHTML="Nada encontrado no TMDB.";}catch(e){g('tR').innerHTML="Erro: "+e.message;}g('b-tmdb').innerText="🔍 PESQUISAR NO TMDB";}
function uT(id,isS){if(bc>=5)return alert("Lote cheio");document.querySelector('input[name="md"][value="add"]').checked=true;tT();ab();if(isS){document.querySelector(`input[name="t_${bc}"][value="sid"]`).checked=true;}else{document.querySelector(`input[name="t_${bc}"][value="f"]`).checked=true;}mt(bc);g(`i_${bc}`).value=id;}

async function ca(){let t=v('aT'),tp=v('aTp'),pg=v('aPg')||1;if(!t)return;g('b-api').innerText="⏳ A BUSCAR...";let u=`https://qcrhfzckhdsryjlesrsu.supabase.co/functions/v1/content-api?action=${tp}&token=${t}&page=${pg}&limit=100`;let txt="";try{let r=await fetch(u,{headers:{"Origin":"https://kingfilms.shop/","Referer":"https://kingfilms.shop/"}});txt=await r.text();let js=JSON.parse(txt),h="";if(js.items&&js.items.length){js.items.forEach(i=>{h+=`<div class="blk" style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:13px"><b style="color:#fff">${i.title}</b><br><span style="color:var(--text-muted)">ID: ${i.tmdb_id||'N/A'}</span></div><button class="btn" style="width:auto;margin:0;padding:8px 16px;font-size:12px;background:linear-gradient(135deg, #3b82f6, #2563eb);" onclick="il('${i.tmdb_id||''}','${tp=='series'?'':(i.stream_url||'')}',${tp=='series'})">⬇️ Importar</button></div>`;});g('aR').innerHTML=h;}else{g('aR').innerHTML=`<div style="font-size:12px;text-align:left;color:#fbbf24;background:#332915;border:1px solid #78350f;padding:12px;border-radius:8px"><b>Resposta:</b><br>${txt}</div>`;}}catch(e){g('aR').innerHTML=`<div style="font-size:12px;color:#fca5a5;text-align:left;background:#451a1a;border:1px solid #7f1d1d;padding:12px;border-radius:8px"><b>Erro:</b><br>${txt?txt.substring(0,150):e.message}</div>`;}g('b-api').innerText="🌐 BUSCAR NA API";}
function il(tmId,url,isS){if(bc>=5)return alert("Lote cheio");document.querySelector('input[name="md"][value="add"]').checked=true; tT(); ab();if(isS){document.querySelector(`input[name="t_${bc}"][value="s"]`).checked=true;mt(bc);g(`lB_${bc}`).value=url;}else{document.querySelector(`input[name="t_${bc}"][value="f"]`).checked=true;mt(bc);g(`lV_${bc}`).value=url;}g(`i_${bc}`).value=tmId;}

async function cc(){
    let o=v('gO'),r=v('gR'),t=v('gT'),fl='catalogo_pro.json';
    if(!o||!r||!t)return alert("Credenciais em falta!");
    g('b-remC').innerText="⏳...";
    try{
        let rq=await fetch(`https://api.github.com/repos/${o}/${r}/contents/${fl}?t=${Date.now()}`,{headers:{Authorization:`Bearer ${t}`},cache:"no-store"});
        if(!rq.ok) throw new Error("Catálogo não encontrado.");
        let resData = await rq.json();
        let blobRq = await fetch(resData.git_url, {headers:{Authorization:`Bearer ${t}`},cache:"no-store"});
        let blobData = await blobRq.json();
        cat = JSON.parse(decodeURIComponent(escape(atob(blobData.content.replace(/\s/g,'')))));
        
        let s=g('sR');s.innerHTML='';
        if(cat.length){
            cat.sort((a,b)=>a.titulo.localeCompare(b.titulo));
            cat.forEach(i=>{let op=document.createElement('option');op.value=i.id;op.text=`${i.tipo=='serie'?'📺':'🎬'} ${i.titulo}`;s.appendChild(op);});
            s.className='';g('b-rem').className='btn btn-del hd'; g('b-rem').classList.remove('hd');
        }
        l("✅ Catálogo lido com sucesso.");
    }catch(e){l("❌ Erro ao ler catálogo: "+e.message);}
    g('b-remC').innerText="🔄 LER SITE";
}
async function rc(){let o=v('gO'),r=v('gR'),t=v('gT'),id=v('sR'),fl='catalogo_pro.json';if(!id)return;g('b-rem').innerText="⏳...";try{cat=cat.filter(i=>i.id!=id);await sR(fl,JSON.stringify(cat,null,2),"rm "+id,t,o,r);l("✅ Apagado do site!");let s=g('sR');for(let i=0;i<s.options.length;i++)if(s.options[i].value==id)s.remove(i);}catch(e){l("❌ Erro ao apagar.");}g('b-rem').innerText="🗑️ APAGAR DO SITE";}
    async function p(){
let o=v('gO'),r=v('gR'),T=v('gT');if(!o||!r||!T)return alert("Preencha as credenciais do GitHub!");['gO','gR','gT'].forEach(i=>localStorage.setItem(i,v(i)));
let bv=[];for(let n=1;n<=bc;n++)if(g(`b_${n}`)&&v(`i_${n}`))bv.push(n);if(!bv.length)return alert("Preencha o ID do TMDB!");
g('b-add').innerText="⏳ A LER DADOS...";l("Iniciando publicação segura...");
g('b-add').style.background = "linear-gradient(135deg, #f59e0b, #d97706)"; 

try {
    let rq=await fetch(`https://api.github.com/repos/${o}/${r}/contents/catalogo_pro.json?t=${Date.now()}`,{headers:{Authorization:`Bearer ${T}`},cache:"no-store"});
    let dt=[];
    if(rq.ok) {
        try {
            let resData = await rq.json();
            let blobRq = await fetch(resData.git_url, {headers:{Authorization:`Bearer ${T}`},cache:"no-store"});
            let blobData = await blobRq.json();
            let txtDecodificado = decodeURIComponent(escape(atob(blobData.content.replace(/\s/g,''))));
            dt = JSON.parse(txtDecodificado);
        } catch(e) {
            l("❌ ERRO CRÍTICO: Catálogo corrompido! Erro: " + e.message);
            g('b-add').innerText="🚀 PUBLICAR CONTEÚDO"; g('b-add').style.background = ""; return;
        }
    } else if (rq.status !== 404) {
        l("❌ ERRO: Conexão GitHub falhou."); g('b-add').innerText="🚀 PUBLICAR CONTEÚDO"; return;
    }

    for(let n of bv){
        let tipoRad = document.querySelector(`input[name="t_${n}"]:checked`).value;
        let I=v(`i_${n}`),isS=(tipoRad=='s'||tipoRad=='sid'),ct=v(`c_${n}`),cap=v(`cp_${n}`),idS="";
        
        let d=await(await fetch(`https://api.themoviedb.org/3/${isS?'tv':'movie'}/${I}?api_key=${AK}&language=pt-BR&append_to_response=images,content_ratings,release_dates&include_image_language=pt,en,null`)).json();
        let t=isS?d.name:d.title,sn=d.overview||"Assista no KINGFILMS.",nt=(d.vote_average&&d.vote_average>0)?d.vote_average.toFixed(1):"0.0",sl=t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"");

        let cB = d.backdrop_path;
        if(d.images&&d.images.backdrops&&d.images.backdrops.length){let bs=d.images.backdrops;let im=bs.find(x=>x.iso_639_1=='pt')||bs.find(x=>x.iso_639_1=='en')||bs.find(x=>x.iso_639_1==null)||bs[0];cB=im.file_path;}
        cB = cB ? `https://image.tmdb.org/t/p/w1280${cB}` : '';
        let cP = cap || (d.poster_path ? `https://image.tmdb.org/t/p/w780${d.poster_path}` : cB);
        if (!cB) cB = cP;

        // INÍCIO DA MÁGICA: CAPTURA AUTOMÁTICA DO LOGO PNG TRANSPARENTE
        let logoPngUrl = "";
        if(d.images && d.images.logos && d.images.logos.length > 0){
            let logoObj = d.images.logos.find(x=>x.iso_639_1=='pt') || d.images.logos.find(x=>x.iso_639_1=='en') || d.images.logos[0];
            if(logoObj) logoPngUrl = `https://image.tmdb.org/t/p/w500${logoObj.file_path}`;
        }
        // FIM DA CAPTURA DO LOGO

        let dR_general=45;
        if(isS){
            if(d.content_ratings&&d.content_ratings.results){
                let br=d.content_ratings.results.find(x=>x.iso_3166_1=='BR');
                if(br&&br.rating)idS=br.rating;
                if(!idS){let us=d.content_ratings.results.find(x=>x.iso_3166_1=='US');if(us&&us.rating)idS=us.rating;}
            }
            if (d.episode_run_time && d.episode_run_time.length > 0) dR_general = Math.max(...d.episode_run_time);
            else if (d.last_episode_to_air && d.last_episode_to_air.runtime) dR_general = d.last_episode_to_air.runtime;
        }
        else{
            if(d.release_dates&&d.release_dates.results){
                let br=d.release_dates.results.find(x=>x.iso_3166_1=='BR');
                if(br&&br.release_dates){let cr=br.release_dates.find(x=>x.certification&&x.certification.trim()!=="");if(cr)idS=cr.certification;}
                if(!idS){let us=d.release_dates.results.find(x=>x.iso_3166_1=='US');if(us&&us.release_dates){let cr=us.release_dates.find(x=>x.certification&&x.certification.trim()!=="");if(cr)idS=cr.certification;}}
            }
            dR_general=d.runtime||90;
        }

        idS = idS.toString().toUpperCase().trim();
        if(idS === "L" || idS === "LIVRE" || idS === "G" || idS.includes("Y")) idS = "Livre";
        else if(idS.includes("10") || idS === "PG" || idS === "TV-PG") idS = "10";
        else if(idS.includes("12") || idS.includes("13")) idS = "12";
        else if(idS.includes("14")) idS = "14";
        else if(idS.includes("16")) idS = "16";
        else if(idS.includes("18") || idS === "R" || idS.includes("MA") || idS === "NC-17") idS = "18";
        else idS = "16";
        
        let tp={};
        
        function ofuscarURL(linkBase, tipo, paramsStr) {
            let idPuro = paramsStr.split("=")[1];
            let hash = btoa(idPuro + "-kf").replace(/=/g, '');
            return `${linkBase}/indicaai/${tipo}?hash=${hash}`;
        }

        if(isS){
            let rawLinks = []; let startId = 0;
            if(tipoRad == 's'){
                rawLinks = v(`lB_${n}`).split('\n').map(x=>x.trim()).filter(x=>x);
                if(!rawLinks.length){l(`❌ Bloco ${n} falhou (Lista vazia).`);continue;}
            } else {
                startId = parseInt(v(`iE_${n}`));
                if(isNaN(startId)){l(`❌ Bloco ${n} falhou (ID Inicial inválido).`);continue;}
            }
            let eps=[];if(d.seasons){d.seasons.forEach(x=>{if(x.season_number>0)eps.push(x.episode_count);});}
            if(!eps.length){l(`❌ Bloco ${n} falhou (TMDB sem eps).`);continue;}

            let totalLinks = tipoRad == 's' ? rawLinks.length : eps.reduce((a, b) => a + b, 0);
            let linkIndex = 0; let currentId = startId; let epCount = 1; let stopProcessing = false;

            for(let s_=1; s_<=eps.length; s_++){
                if(stopProcessing) break;
                tp[s_] = [];
                let seasonData = null;
                try { let sReq = await fetch(`https://api.themoviedb.org/3/tv/${I}/season/${s_}?api_key=${AK}&language=pt-BR`); if(sReq.ok) seasonData = await sReq.json(); } catch(e) {}

                for(let e_=1; e_<=eps[s_-1]; e_++){
                    if(tipoRad == 's' && linkIndex >= rawLinks.length) {
                        stopProcessing = true; break;
                    }

                    let ss = s_<10 ? "0"+s_ : s_;
                    let ee = e_<10 ? "0"+e_ : e_;
                    
                    let nx = "";
                    if(tipoRad == 's') {
                        if(linkIndex + 1 < rawLinks.length) {
                            let nxE = e_ + 1; let nxS = s_;
                            if(nxE > eps[s_-1]) { nxE = 1; nxS = s_ + 1; }
                            let nxSS = nxS<10 ? "0"+nxS : nxS;
                            let nxEE = nxE<10 ? "0"+nxE : nxE;
                            nx = `${sl}-s${nxSS}e${nxEE}.html`;
                        } else {
                            nx = "../index.html";
                        }
                    } else {
                        let nxE = (e_+1)<10 ? "0"+(e_+1) : (e_+1);
                        let nxS = (s_+1)<10 ? "0"+(s_+1) : (s_+1);
                        nx = e_<eps[s_-1] ? `${sl}-s${ss}e${nxE}.html` : (s_<eps.length ? `${sl}-s${nxS}e01.html` : "../index.html");
                    }

                    let fl = `${sl}-s${ss}e${ee}.html`;
                    
                    let vd = "";
                    if(tipoRad == 's') {
                        vd = rawLinks[linkIndex]; linkIndex++;
                    } else {
                        let hashE = btoa(currentId + "-kf").replace(/=/g, '');
                        vd = `https://kingfilms-api.onrender.com/indicaai/episodio?hash=${hashE}`;
                        currentId++;
                    }

                    let epRuntime = dR_general;
                    if(seasonData && seasonData.episodes){ let epInfo = seasonData.episodes.find(x => x.episode_number === e_); if(epInfo && epInfo.runtime) epRuntime = epInfo.runtime; }
                    let iD_Episodio = fD(epRuntime);
                    
                    g('b-add').innerText=`⏳ ENVIANDO EP ${epCount} DE ${totalLinks}...`;
                    await sR(`v/${fl}`,gh(`${t} S${ss}E${ee} 🌀`,cB,vd,nx,iD_Episodio),"ep",T,o,r);
                    tp[s_].push({tit:`S${ss}E${ee} 🌀`,linkFisico:`v/${fl}`,logoEp:cB});
                    epCount++; await new Promise(x=>setTimeout(x,300));
                }
                if(tp[s_].length === 0) delete tp[s_];
            }
        }
        else{
            let vd=v(`lV_${n}`),fl=`${sl}.html`;if(!vd){l(`❌ Bloco ${n} falhou.`);continue;} 
            g('b-add').innerText=`⏳ ENVIANDO FILME...`; 
        if(vd.includes("/indicaai/filme?") && vd.includes("nome=")) {
                let parts = vd.split("?");
                vd = ofuscarURL(parts[0].replace("/indicaai/filme", ""), "filme", parts[1]);
            }
            
            let iD_Filme = fD(dR_general);
            await sR(`v/${fl}`,gh(`${t} 🌀`,cB,vd,"../index.html",iD_Filme),"fl",T,o,r);
            tp={"1":[{tit:"Assistir 🌀",linkFisico:`v/${fl}`,logoEp:cB}]};
        }
        
        dt=dt.filter(i=>i.id!=sl);
        // O LOGO É INJETADO AQUI NA HORA DE SALVAR NO JSON
        dt.push({ id: sl, tipo: isS ? 'serie' : 'filme', categoria: ct, titulo: `${t} 🌀`, logo: cP, logo_horizontal: cB, logo_png: logoPngUrl, sinopse: sn, nota: nt, avaliacao: nt, classificacao: idS, temporadas: tp });
        l(`✅ ${t} processado!`);
    }

    g('b-add').innerText=`⏳ ATUALIZANDO CATÁLOGO...`;
    await sR("catalogo_pro.json",JSON.stringify(dt,null,2),"Atualizando Catálogo Principal",T,o,r);
    l("✅ TUDO FINALIZADO E PUBLICADO!"); g('b-add').innerText="🚀 PUBLICAR CONTEÚDO"; g('b-add').style.background = "";
} catch(e){
    l("❌ Erro Geral: "+e.message); g('b-add').innerText="TENTAR NOVAMENTE"; g('b-add').style.background = "";
}
}

</script></body></html>
