<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINGFILMS Player 🌀</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        video { width: 100%; max-width: 100vw; height: 100%; outline: none; }
        .loader { position: absolute; color: #e50914; font-family: 'Poppins', sans-serif; font-weight: bold; font-size: 18px; letter-spacing: 2px; z-index: 10; }
    </style>
</head>
<body>
    <div class="loader" id="loadingText">A CARREGAR KINGFILMS...</div>
    
    <video id="videoPlayer" controls autoplay playsinline style="display:none;">
        <source id="videoSource" src="" type="video/mp4">
    </video>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('v');
        const titulo = urlParams.get('t') || "KINGFILMS";
        const capa = urlParams.get('c') || "";
        const duracao = urlParams.get('d') || "PT01H30M00S"; // Duração padrão se não enviada
        
        // 🚀 INJEÇÃO DINÂMICA DO JSON-LD PARA SEO!
        if(titulo !== "KINGFILMS") {
            document.title = titulo + " 𝐊𝐢𝐧𝐠𝐟𝐢𝐥𝐦𝐬 🌀";
            
            const jsonLd = {
                "@context": "https://schema.org",
                "@type": "VideoObject",
                "name": titulo + " 𝐊𝐢𝐧𝐠𝐟𝐢𝐥𝐦𝐬 🌀",
                "thumbnailUrl": [capa],
                "uploadDate": new Date().toISOString(),
                "duration": duracao,
                "contentUrl": videoUrl,
                "interactionStatistic": {
                    "@type": "InteractionCounter",
                    "interactionType": {"@type": "WatchAction"},
                    "userInteractionCount": Math.floor(Math.random()*5000)+5000
                }
            };

            const scriptSeo = document.createElement('script');
            scriptSeo.type = 'application/ld+json';
            scriptSeo.text = JSON.stringify(jsonLd);
            document.head.appendChild(scriptSeo);
        }

        if(videoUrl) {
            const videoElement = document.getElementById('videoPlayer');
            const sourceElement = document.getElementById('videoSource');
            const loader = document.getElementById('loadingText');
            
            sourceElement.src = videoUrl;
            videoElement.load();
            
            videoElement.oncanplay = () => {
                loader.style.display = 'none';
                videoElement.style.display = 'block';
            };
            
            setTimeout(() => {
                loader.style.display = 'none';
                videoElement.style.display = 'block';
            }, 3000);

        } else {
            document.getElementById('loadingText').innerText = "ERRO: Filme não encontrado.";
            document.getElementById('loadingText').style.color = "#fff";
        }
    </script>
</body>
</html>
